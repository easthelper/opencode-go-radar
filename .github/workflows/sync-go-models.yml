name: One-shot Go model sync
on:
  push:
    paths: ['.github/workflows/sync-go-models.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Patch models
        run: |
          python - <<'PY'
          import json
          p='data/models.json'; d=json.load(open(p)); d['as_of']='2026-09-22'
          if not any(m['model']=='Grok 4.7' for m in d['models']):
            d['models'].insert(0,{"model":"Grok 4.7","developer":"xAI","provider":"Unknown","input_price":2.0,"output_price":6.0,"cached_input":0.5,"context":"Unknown","reasoning":None,"benchmark":"N/A","training":"No Training","retention":"30 days","chinese_model":False,"hosting":"Unknown","china_transfer":"Unknown","coding_grade":"N/A","value_grade":"N/A","privacy_risk":"Medium","positioning":[],"notes":"Current OpenCode Go official model, pricing, endpoint, request-estimate, and privacy tables confirm availability. Pricing shown is the <=200K tier; >200K is $4 input / $12 output / $1 cached read. Context maximum, reasoning, benchmark, provider/routing, and hosting are not inferred."})
          for m in d['models']:
            if m['model']=='DeepSeek V4.1 Flash': m['notes']=m.get('notes','').replace('through Sep 20','through Sep 27')
          with open(p,'w') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/models.json
          git diff --cached --quiet || (git commit -m 'Sync Grok 4.7 and DeepSeek promotion' && git push)
