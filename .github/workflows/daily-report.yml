name: Build daily report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # 08:00 KST (next day)
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/daily-report.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate model data
        run: python -m json.tool data/models.json >/dev/null
      - name: Build email HTML
        run: python scripts/build_email.py
      - name: Commit generated report
        run: |
          if [ -z "$(git status --porcelain -- reports/email-latest.html)" ]; then
            echo 'No generated report changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/email-latest.html
          git commit -m 'chore: rebuild email report'
          git push
