name: Radar sync 2026-09-24
on:
  push:
    paths:
      - '.github/workflows/radar-sync-20260924.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update radar data
        shell: python
        run: |
          import json, pathlib
          today='2026-09-24'
          mp=pathlib.Path('data/models.json'); up=pathlib.Path('data/usage.json')
          m=json.loads(mp.read_text()); u=json.loads(up.read_text())
          by={x['model']:x for x in m['models']}
          if 'GPT 6 Luna' not in by:
            m['models'].insert(2, {
              'model':'GPT 6 Luna','developer':'OpenAI','provider':'Unknown',
              'input_price':0.10,'output_price':0.50,'cached_input':0.01,
              'context':'Unknown','reasoning':None,'benchmark':'N/A',
              'training':'No Training','retention':'Up to 30 days abuse logs',
              'chinese_model':False,'hosting':'Unknown','china_transfer':'Unknown',
              'coding_grade':'N/A','value_grade':'N/A','privacy_risk':'Medium','positioning':[],
              'notes':'Current OpenCode Go official model list, pricing, endpoint, request-estimate, and privacy tables confirm availability. Pricing shown is the <=272K tier; >272K is $0.20 input / $0.75 output / $0.02 cached read / $0.25 cached write. Context maximum, reasoning, benchmark, provider/routing, and hosting are not inferred.'
            })
          if 'Space Bunny Free' not in by:
            m['models'].append({
              'model':'Space Bunny Free','developer':'Anonymous','provider':'Unknown',
              'input_price':0.0,'output_price':0.0,'cached_input':0.0,
              'context':'Unknown','reasoning':None,'benchmark':'N/A',
              'training':'No Training','retention':'0 days','chinese_model':False,
              'hosting':'Unknown','china_transfer':'Unknown','coding_grade':'N/A','value_grade':'N/A',
              'privacy_risk':'Medium','positioning':[],
              'notes':'Official Go docs and landing page list this anonymous model as free with unlimited usage for a limited time. Identity, context, reasoning, benchmark, provider/routing, hosting, region, and promotion end date are not disclosed, so they are not inferred.'
            })
          u['models']['GPT 6 Luna']={'monthly_usage_usd':15,'requests_5h':4230,'requests_week':10560,'requests_month':21130}
          u['models']['Space Bunny Free']={'monthly_usage_usd':None,'requests_5h':None,'requests_week':None,'requests_month':None,'unlimited':True,'promotion':'Free for a limited time','promotion_end':None}
          m['as_of']=today; u['as_of']=today
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          up.write_text(json.dumps(u,ensure_ascii=False,indent=2)+'\n')
          ap=pathlib.Path('assets/app.js'); s=ap.read_text()
          s=s.replace("const LAST_CHECKED = '2026-09-23';", "const LAST_CHECKED = '2026-09-24';")
          s=s.replace("<td class=\"usage\"><strong>$${Number(effectiveMonthlyUsage(m)||0).toFixed(0)}</strong></td><td>${fmtInt(effectiveRequestsMonth(m))}</td>", "<td class=\"usage\"><strong>${m.unlimited?'Unlimited':'$'+Number(effectiveMonthlyUsage(m)||0).toFixed(0)}</strong></td><td>${m.unlimited?'Unlimited':fmtInt(effectiveRequestsMonth(m))}</td>")
          ap.write_text(s)
          # invariants
          mn=[x['model'] for x in m['models']]; un=list(u['models'])
          assert len(mn)==len(set(mn))
          assert set(mn)==set(un), (set(mn)-set(un),set(un)-set(mn))
          assert all(v in set(mn) for v in m['recommendations'].values())
          assert u['models']['DeepSeek V4.1 Flash']['promotion_end']=='2026-09-27'
      - name: Commit synchronized radar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/models.json data/usage.json assets/app.js
          git commit -m 'Update Go lineup with GPT 6 Luna and Space Bunny Free'
          git push
